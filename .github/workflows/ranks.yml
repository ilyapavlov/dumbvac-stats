name: ranks
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build_ranks.py
        env:
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          AMPLITUDE_SECRET_KEY: ${{ secrets.AMPLITUDE_SECRET_KEY }}
      - run: |
          git config user.name "ranks bot"
          git config user.email "actions@users.noreply.github.com"
          git add ranks.json
          git diff --cached --quiet || git commit -m "ranks: $(date -u +%F)"
          git push
